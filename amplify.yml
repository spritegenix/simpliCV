version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies with legacy-peer-deps"
        - npm install --legacy-peer-deps
        - npm install --include=optional sharp || npm install --os=linux --cpu=x64 sharp
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*